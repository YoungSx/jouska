name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 一个 tag 只部署一次；重复打同名 tag 不会排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 拉全历史与 tag——构建版本号来自 `git describe`，浅克隆
      # 拿不到 tag 就会把 v0.16.0 部署成一行 sha 或干脆 'dev'，拒绝屏上的版本
      # 串就成了谎话。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 构建版本号，算一次三处用：面板 Worker（--var）、反代 Worker（--var）、
      # SPA（vite.config 自己跑同一条 git describe，同一 checkout 天然一致）。
      # 不是机密——它命名的是「从哪个提交构建的」，这正是拒绝屏要报给用户的。
      - name: Compute build id
        run: |
          echo "BUILD_ID=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      # Worker 的 index.ts 通过 `import 'jouska'` 引用库，而 jouska 的
      # exports 指向 ./dist/index.js——wrangler 打包前必须先产出 dist。
      - run: npm run build -w jouska

      # 面板的前端：vite 产物直接落进 admin-panel/public，wrangler deploy 随
      # 静态资源一起上传。产物不入库（见 .gitignore），所以必须在 CI 里构建。
      - run: npm run build -w @jouska/admin-panel

      # 找到或创建 D1/KV，把真实 id 写进 wrangler.jsonc（runner 是一次性的，
      # 不会污染仓库）。顺序执行而非并行：首次部署时两个 job 赛跑创建同名
      # D1 会让其中一个失败。CI 只跑仓库，个人 id 永远不落进 git。
      - name: Provision D1/KV and wire ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:setup

      # 迁移先于部署：新代码上线时它依赖的表必须已存在。
      - name: Apply D1 migrations
        working-directory: workers/admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply jouska-admin --remote

      # 域名发现要读账号 id。它不是密钥，但也不该写进被 git 跟踪的
      # wrangler.jsonc——用 CI 已有的 secret 在部署时注入，仓库里始终只有占位符。
      # Access 身份验签的两个值。启用 Worker 级 Access 时仪表盘给出的 AUD 标签
      # （Worker 页 → Access 标签页）和团队域名在这里注入，仓库里始终只有占位符。
      # 缺了任何一个面板都答 401——"unauthenticated"，拒绝页那扇门就还是关着的。
      - name: Deploy admin panel and health-check
        working-directory: workers/admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM: ${{ secrets.ACCESS_TEAM }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          extra_vars=(--var BUILD_ID:"$BUILD_ID")
          for name in ACCESS_TEAM ACCESS_AUD; do
            if [ -n "${!name}" ]; then
              extra_vars+=(--var "$name:${!name}")
            fi
          done
          out=$(npx wrangler deploy "${extra_vars[@]}" \
            --var CF_ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            echo "deploy output contained no workers.dev URL" >&2
            exit 1
          fi
          # 上传后 workerd 需要几秒才对新版本应答，重试直到有应答或超时。
          # Access 开启后匿名请求拿不到 /api/health 的 JSON——只会收到 302/401
          # 的登录跳转。那也算「活了」：能跳进 Access 登录页的只可能是一个部署
          # 成功的 Worker。代价说实话：这个检查退化为「部署在且门关着」，验证不
          # 了 Worker 内部健康；要看真话，用带 Access 凭据的浏览器开一次面板。
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$url/api/health")
            if [ "$code" = "200" ] \
              && curl -fsS -m 10 "$url/api/health" | grep -q '"ok":true'; then
              echo "admin panel healthy at $url"
              exit 0
            fi
            if [ "$code" = "302" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::notice::admin panel answering behind Cloudflare Access (HTTP $code) at $url"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed at $url/api/health (last status: $code)" >&2
          exit 1

      # 建号窗口：按面板的状态自动开合，不是每次部署都开。
      #
      # 判据是状态（没有可用的管理员）而不是事件（部署发生了）：有管理员在，
      # 这一步把可能残留的窗口行清掉（卫生）；没有，才写入一个 7 天截止时间。
      # 面板的登录中间件只在陌生人敲门时读它——放进来一次就整行删除（一次性
      # 熔断），所以它不是常开的门，是留给「管理员没了」的应急钥匙。
      #
      # 失败不阻断部署：面板照常上线，只是应急钥匙没挂上去。最坏情况等于本
      # commit 之前的行为——锁死时走 admin-reset.yml 清表重来。
      - name: Open or clear the provision window
        working-directory: workers/admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler d1 execute jouska-admin --remote --json \
            --command "SELECT COUNT(*) AS n FROM users WHERE role = 'admin' AND disabled = 0;" 2>/dev/null)
          admins=$(echo "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { console.log(JSON.parse(s)[0].results[0].n); } catch { console.log("parse-failed"); }
            })')
          if [ "$admins" = "parse-failed" ]; then
            echo "::warning::could not count enabled admins — provision window left untouched"
            exit 0
          fi
          if [ "$admins" != "0" ]; then
            npx wrangler d1 execute jouska-admin --remote --json \
              --command "DELETE FROM settings WHERE key = 'provision_window';" >/dev/null 2>&1 || true
            echo "::notice::panel has $admins enabled admin(s) — provision window cleared/closed"
            exit 0
          fi
          # d1 execute has no --params flag, and the value needs none: the
          # deadline is a bare integer out of node, so inlining it into the
          # SQL text carries no injection surface. Interpolation, not binding,
          # is therefore the honest form here — verified against a local D1.
          deadline=$(node -e 'console.log(Math.floor(Date.now()/1000) + 7*86400)')
          if npx wrangler d1 execute jouska-admin --remote --json \
            --command "INSERT INTO settings (key, value) VALUES ('provision_window', '{\"deadline\": $deadline}')
                       ON CONFLICT (key) DO UPDATE SET value = excluded.value" >/dev/null 2>&1; then
            echo "::notice::no enabled admin — provision window open for 7 days (burns on first use)"
          else
            echo "::warning::no enabled admin, but the window write failed — use admin-reset.yml if locked out"
          fi

      # 「域名」页要调 Cloudflare API，凭据复用部署用的这一个。
      #
      # 权限：三个来源都靠这一个 token。Cloudflare 的 Edit 含 Read，所以部署
      # token 原有的 Workers Scripts Edit 覆盖 workers.dev 与 Custom Domains，
      # Workers Routes Edit 覆盖 zone 路由查询（两条已实测确认）。列举账号下的
      # zone 还要 Zone Read——部署本身不需要它，是为这个功能补上的。
      # 任一来源读不到都不报错：那一项显示"读不到"并说明缺什么，其余照常。
      #
      # 代价说清楚：这个 token 带写权限（Workers/KV/D1 Edit），远超域名发现需要
      # 的三个读权限。面板被打穿，攻击者拿到的就是能改配置的凭据，而不是只能看
      # 域名。换成单独的只读 token 能消掉这一层，但要手工维护第二个 secret。
      #
      # secret put 从 stdin 读，token 不出现在命令行里（ps 和构建日志都看不到）。
      # 幂等：已存在就覆盖成同值。失败不阻断部署——面板照常工作，只是「域名」页
      # 会说凭据缺失。
      - name: Wire the panel's API token for hostname discovery
        working-directory: workers/admin-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if printf '%s' "$CLOUDFLARE_API_TOKEN" \
            | npx wrangler secret put CF_API_TOKEN >/dev/null 2>&1; then
            echo "::notice::CF_API_TOKEN set; the 域名 screen can read bound hostnames"
          else
            echo "::warning::could not set CF_API_TOKEN — the 域名 screen will report it as missing"
          fi

      # 面板先上（写 KV），反代后上（读 KV）——顺序即依赖方向。
      - name: Deploy reverse proxy
        working-directory: workers/reverse-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # BUILD_ID 跟着反代走：jouska 用它给自建的拒绝响应盖 x-jouska-build 头，
        # 让被守卫挡下的调用方也能对上「哪个版本在拦我」。
        run: npx wrangler deploy --var BUILD_ID:"$BUILD_ID"
