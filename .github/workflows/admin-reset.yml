name: Reset admin panel accounts

# Locked-out recovery: under the Cloudflare Access model the panel admits its
# first caller through an empty `users` table as admin, whatever the provision
# policy says — so clearing that table is the documented way back in. Manual
# only, and guarded by a typed confirmation — this deletes production accounts.
#
# Routes, settings, the audit log and the published KV document are untouched,
# so the reverse proxy keeps serving traffic throughout.
#
# mcp_tokens is deleted first, on purpose: its user columns are
# ON DELETE RESTRICT, so a leftover token would refuse the users wipe rather
# than cascade. Tokens do not survive the accounts they were minted by.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm deleting all panel accounts'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without an exact confirmation
        if: inputs.confirm != 'RESET'
        run: |
          echo "::error::confirm must be exactly RESET (got: '${{ inputs.confirm }}')"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same find-or-create step the deploy pipeline uses: patches the real
      # D1 id into the account-agnostic template so wrangler can reach it.
      - name: Provision D1/KV and wire ids
        run: npm run cf:setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show what will be deleted
        working-directory: workers/admin-panel
        run: |
          npx wrangler d1 execute jouska-admin --remote --json \
            --command "SELECT u.subject, u.role, u.disabled, COUNT(t.id) AS tokens
                       FROM users u LEFT JOIN mcp_tokens t ON t.user_id = u.id
                       GROUP BY u.id;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Clear accounts and their tokens
        working-directory: workers/admin-panel
        run: |
          npx wrangler d1 execute jouska-admin --remote \
            --command "DELETE FROM mcp_tokens; DELETE FROM users;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Proof the reset took effect, read back from D1 rather than from the
      # delete's own exit code. Not from the panel over HTTP: under Access the
      # unauthenticated /api/auth/me reports nothing about table state, and
      # curling an Access-fronted hostname from CI would only get the login page.
      - name: Confirm the table is empty
        working-directory: workers/admin-panel
        run: |
          out=$(npx wrangler d1 execute jouska-admin --remote --json \
            --command "SELECT COUNT(*) AS n FROM users;" 2>/dev/null)
          echo "$out"
          n=$(echo "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const r=JSON.parse(s);
                    console.log(r[0].results[0].n); } catch { console.log("parse-failed"); }
            })')
          if [ "$n" != "0" ]; then
            echo "::error::users still has $n row(s) — the delete did not take effect"
            exit 1
          fi
          echo "::notice::Reset complete. The next address Cloudflare Access admits becomes the panel admin; sign in normally."
