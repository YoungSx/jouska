name: Reset admin panel accounts

# Locked-out recovery: the panel's bootstrap endpoint opens only while `users`
# is empty, so clearing that table is the documented way back in. Manual only,
# and guarded by a typed confirmation — this deletes production credentials.
#
# Routes, settings, the audit log and the published KV document are untouched,
# so the reverse proxy keeps serving traffic throughout.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm deleting all panel accounts'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without an exact confirmation
        if: inputs.confirm != 'RESET'
        run: |
          echo "::error::confirm must be exactly RESET (got: '${{ inputs.confirm }}')"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same find-or-create step the deploy pipeline uses: patches the real
      # D1 id into the account-agnostic template so wrangler can reach it.
      - name: Provision D1/KV and wire ids
        run: npm run cf:setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show what will be deleted
        working-directory: workers/admin-panel
        run: |
          npx wrangler d1 execute jouska-admin --remote --json \
            --command "SELECT subject, role, disabled, failed_attempts FROM users;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Sessions go too: a stale cookie must not outlive the account it names.
      - name: Clear accounts and sessions
        working-directory: workers/admin-panel
        run: |
          npx wrangler d1 execute jouska-admin --remote \
            --command "DELETE FROM sessions; DELETE FROM users;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Proof the reset took effect, read from the panel itself rather than from
      # the delete's own exit code. The URL is not hardcoded: every account has
      # a different workers.dev subdomain, so it is derived from the deployment.
      - name: Confirm the panel reports itself bootstrappable
        working-directory: workers/admin-panel
        run: |
          url=$(npx wrangler deployments list --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { const u = JSON.stringify(JSON.parse(s)).match(/https:\/\/[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev/);
                      if (u) console.log(u[0]); } catch {}
              })')
          if [ -z "$url" ]; then
            echo "::notice::Could not derive the panel URL; skipping the readback. Accounts were cleared — open the panel and create a new admin."
            exit 0
          fi
          body=$(curl -fsS --max-time 15 "$url/api/auth/me")
          echo "GET $url/api/auth/me -> $body"
          echo "$body" | grep -q '"bootstrapable":true' || {
            echo "::error::panel still reports bootstrapable:false — accounts were not cleared"
            exit 1
          }
          echo "::notice::Reset complete. Open $url and create a new admin."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
